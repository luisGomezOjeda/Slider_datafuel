<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataFuel | Galería</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: transparent;
    font-family: Arial, sans-serif;
}

.slider-container {
    max-width: 1100px;
    margin: auto;
}

.slider {
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    background: #171717;
    aspect-ratio: 16 / 9;
}

.slides {
    display: flex;
    height: 100%;
    transition: transform .55s ease;
}

.slide {
    min-width: 100%;
    height: 100%;
}

.slide img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
}

/* Flechas */

.arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,.65);
    color: white;
    font-size: 22px;
    cursor: pointer;
    z-index: 2;
}

.arrow:hover {
    background: rgba(0,0,0,.9);
}

.prev { left: 15px; }
.next { right: 15px; }

/* Indicadores */

.dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 16px;
}

.dot {
    width: 9px;
    height: 9px;
    border: none;
    border-radius: 20px;
    background: #aaa;
    cursor: pointer;
    transition: .3s;
}

.dot.active {
    width: 25px;
    background: #333;
}

/* Contador */

.counter {
    text-align: center;
    font-size: 13px;
    color: #777;
}

@media(max-width:600px) {
    body { padding: 5px; }
    .arrow {
        width: 34px;
        height: 34px;
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="slider-container">

    <div class="slider" id="slider">
        <div class="slides" id="slides"></div>

        <button class="arrow prev"
            onclick="move(-1)">&#10094;</button>

        <button class="arrow next"
            onclick="move(1)">&#10095;</button>
    </div>

    <div class="dots" id="dots"></div>

    <div class="counter" id="counter"></div>

</div>

<script>

const API =
"https://api.github.com/repos/luisGomezOjeda/Slider_datafuel/contents/slider";

let current = 0;
let images = [];
let timer;

async function loadImages() {

    const slides = document.getElementById("slides");

    try {

        const response = await fetch(API);

        if (!response.ok) {
            throw new Error("No se pudo acceder a las imágenes");
        }

        const files = await response.json();

        images = files.filter(file =>
            /\.(jpg|jpeg|png|webp|gif|avif)$/i.test(file.name)
        );

        images.sort((a,b) =>
            a.name.localeCompare(b.name, undefined, {
                numeric: true
            })
        );

        if (images.length === 0) {
            slides.innerHTML =
                "<p style='color:white;padding:20px'>No hay imágenes disponibles.</p>";
            return;
        }

        images.forEach(image => {

            const slide = document.createElement("div");
            slide.className = "slide";

            const img = document.createElement("img");
            img.src = image.download_url;
            img.alt = image.name;

            slide.appendChild(img);
            slides.appendChild(slide);

        });

        createDots();
        updateSlider();
        startAutoplay();

    } catch(error) {

        slides.innerHTML =
            "<p style='color:white;padding:20px'>Error al cargar las imágenes. Verificá que el repositorio sea público.</p>";

        console.error(error);

    }
}

function createDots() {

    const container = document.getElementById("dots");

    images.forEach((image, index) => {

        const dot = document.createElement("button");

        dot.className = "dot";
        dot.setAttribute("aria-label", "Imagen " + (index + 1));

        dot.onclick = () => {
            current = index;
            updateSlider();
            resetAutoplay();
        };

        container.appendChild(dot);

    });
}

function updateSlider() {

    document.getElementById("slides").style.transform =
        `translateX(-${current * 100}%)`;

    document.querySelectorAll(".dot").forEach((dot, index) => {
        dot.classList.toggle("active", index === current);
    });

    document.getElementById("counter").textContent =
        `${current + 1} / ${images.length}`;
}

function move(direction) {

    current = (current + direction + images.length) % images.length;

    updateSlider();
    resetAutoplay();
}

function startAutoplay() {

    if (images.length < 2) return;

    timer = setInterval(() => {
        current = (current + 1) % images.length;
        updateSlider();
    }, 5000);
}

function resetAutoplay() {
    clearInterval(timer);
    startAutoplay();
}

loadImages();

</script>

</body>
</html>
